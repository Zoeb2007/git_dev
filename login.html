<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 32px; width: 320px; }
        .login-card h2 { margin-top: 0; color: #333; }
        .login-card label { display: block; margin-top: 16px; color: #555; }
        .login-card input { width: 100%; padding: 10px 12px; margin-top: 8px; border: 1px solid #ccd3e0; border-radius: 8px; }
        .login-card button { margin-top: 24px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2f80ed; color: #fff; font-size: 16px; cursor: pointer; }
        .login-card button:hover { background: #1f6fd8; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Login</h2>
        <form>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
